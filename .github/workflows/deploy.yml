name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The site has no runtime dependencies; the build is plain Node ESM.
      - name: Build
        run: node build.mjs

      # Fails the run on broken links, duplicate/oversized SEO fields,
      # missing alt text, unlabelled inputs or invalid JSON-LD.
      - name: Audit
        run: node scripts/audit.mjs

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.benvelazquez.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node build.mjs

      # Deploying from Cloudflare's own Git integration is a valid setup, in
      # which case these secrets are intentionally absent. Skip rather than
      # fail, so a working deploy elsewhere doesn't leave main permanently red.
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy — CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set. If Cloudflare deploys this repo directly, that is expected. Add both secrets to deploy from GitHub Actions instead."
          fi

      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must be 4.x. The action defaults to wrangler 3.90.0, which predates
          # wrangler.jsonc support (added in 3.91.0) and would ignore our config
          # entirely, failing with "Missing entry-point". 4.x is also required
          # for the `run_worker_first` glob syntax in the assets config.
          wranglerVersion: "4"
          # wrangler.jsonc points at ./dist and worker/index.js
          command: deploy
